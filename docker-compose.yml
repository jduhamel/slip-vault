# A Vault dev server for the tests. Start it with `make vault-up` and run the
# tests against it with `make test-docker`. Dev mode keeps everything in
# memory and uses the fixed root token "root" so never use it for real
# secrets.
services:
  vault:
    image: hashicorp/vault:1.17
    command: server -dev
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 2s
      timeout: 2s
      retries: 15
